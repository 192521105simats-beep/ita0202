<!DOCTYPE html>
<html>
<head>
    <title>Creating a Webpage Using Images, Hyperlinks, and Iframes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 80%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        h2 {
            color: darkgreen;
            margin-top: 25px;
        }

        img {
            width: 300px;
            height: 200px;
            border: 4px solid #007BFF;
            border-radius: 10px;
        }

        a {
            text-decoration: none;
            color: white;
            background: #007BFF;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }

        a:hover {
            background: #0056b3;
        }

        iframe {
            width: 700px;
            height: 400px;
            border: 3px solid #007BFF;
            border-radius: 10px;
            margin-top: 15px;
        }

        footer {
            margin-top: 20px;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Creating a Webpage Using Images, Hyperlinks, and Iframes</h1>

    <h2>Image</h2>

    <img src="Photo/student.jpg" alt="Student Image" width="300" height="200">

    <h2>Hyperlink</h2>

    <p>
        <a href="https://www.google.com" target="_blank">
            Visit Google
        </a>
    </p>

    <h2>Embedded Webpage</h2>

    <iframe
        src="https://www.wikipedia.org"
        title="Wikipedia">
    </iframe>

    <footer>
        <p>Web Technology</p>
    </footer>

</div>

</body>
</html>
