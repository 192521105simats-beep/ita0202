<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock and Exam Countdown</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 450px;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
        }

        #clock {
            font-size: 45px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        #date {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        .countdown {
            background: #f2f2f2;
            padding: 20px;
            border-radius: 10px;
        }

        #timer {
            font-size: 30px;
            font-weight: bold;
            color: #e74c3c;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Digital Clock</h1>

        <div id="clock">00:00:00</div>

        <div id="date"></div>

        <div class="countdown">
            <h2>Examination Countdown</h2>
            <div id="timer">Loading...</div>
        </div>

    </div>

    <script>

        // Set examination date and time
        let examDate = new Date("2026-08-15T09:00:00");

        function updateClock() {

            let now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");

            document.getElementById("clock").textContent =
                hours + ":" + minutes + ":" + seconds;

            document.getElementById("date").textContent =
                now.toDateString();
        }

        function updateCountdown() {

            let now = new Date();

            let difference = examDate - now;

            if (difference <= 0) {

                document.getElementById("timer").textContent =
                    "Examination Started!";

                return;
            }

            let days = Math.floor(difference / (1000 * 60 * 60 * 24));

            let hours = Math.floor(
                (difference / (1000 * 60 * 60)) % 24
            );

            let minutes = Math.floor(
                (difference / (1000 * 60)) % 60
            );

            let seconds = Math.floor(
                (difference / 1000) % 60
            );

            document.getElementById("timer").textContent =
                days + " Days " +
                hours + " Hours " +
                minutes + " Minutes " +
                seconds + " Seconds";
        }

        updateClock();
        updateCountdown();

        setInterval(updateClock, 1000);
        setInterval(updateCountdown, 1000);

    </script>

</body>
</html>
