<!DOCTYPE html>
<html>
<head>
<title>JavaScript Debugging Example</title>

<style>
body{
    font-family: Arial;
    background:#f2f2f2;
    text-align:center;
}

.container{
    width:350px;
    margin:100px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

input{
    width:90%;
    padding:10px;
    margin:10px;
}

button{
    padding:10px 20px;
    background:green;
    color:white;
    border:none;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-size:20px;
    color:blue;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h2>JavaScript Debugging Example</h2>

<input type="number" id="num1" placeholder="First Number">

<input type="number" id="num2" placeholder="Second Number">

<br><br>

<button onclick="calculateSum()">Calculate Sum</button>

<p id="result"></p>

</div>

<script>
function calculateSum(){

    var a = Number(document.getElementById("num1").value);
    var b = Number(document.getElementById("num2").value);

    var sum = a + b;

    document.getElementById("result").innerHTML = "Sum = " + sum;
}
</script>

</body>
</html>
