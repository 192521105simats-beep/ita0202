<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
}

.container{
    width:100%;
    max-width:700px;
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    color:#0077cc;
    margin-bottom:30px;
}

.row{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#444;
}

input[type=text],
input[type=email],
input[type=date],
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    outline:none;
    font-size:15px;
    transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#0077ff;
    box-shadow:0 0 8px rgba(0,119,255,.3);
}

.gender{
    display:flex;
    gap:20px;
    margin-top:5px;
}

.gender label{
    font-weight:normal;
}

input[type=file]{
    margin-top:5px;
}

.check{
    display:flex;
    align-items:center;
    gap:10px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:25px;
}

button{
    padding:12px 30px;
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.submit{
    background:#0077ff;
    color:white;
}

.submit:hover{
    background:#005fd6;
    transform:translateY(-3px);
}

.reset{
    background:#ff5252;
    color:white;
}

.reset:hover{
    background:#e53935;
    transform:translateY(-3px);
}

@media(max-width:600px){

.container{
    padding:20px;
}

.gender{
    flex-direction:column;
    gap:8px;
}

.buttons{
    flex-direction:column;
}

button{
    width:100%;
}

}

</style>
</head>

<body>

<div class="container">

<h1>🎓 Student Registration Form</h1>

<form>

<div class="row">
<label>Student Name</label>
<input type="text" placeholder="Enter your name" required>
</div>

<div class="row">
<label>Email Address</label>
<input type="email" placeholder="Enter your email" required>
</div>

<div class="row">
<label>Date of Birth</label>
<input type="date">
</div>

<div class="row">
<label>Gender</label>

<div class="gender">
<div>
<input type="radio" name="gender"> Male
</div>

<div>
<input type="radio" name="gender"> Female
</div>
</div>

</div>

<div class="row">
<label>Select Course</label>

<select>

<option>--Select Course--</option>

<option>Computer Science Engineering</option>

<option>Electronics and Communication Engineering</option>

<option>Electrical and Electronics Engineering</option>

<option>Mechanical Engineering</option>

</select>

</div>

<div class="row">

<label>Address</label>

<textarea rows="4" placeholder="Enter your address"></textarea>

</div>

<div class="row">

<label>Upload Photograph</label>

<input type="file">

</div>

<div class="row check">

<input type="checkbox" required>

<label>I confirm that the above information is correct.</label>

</div>

<div class="buttons">

<button class="submit">Register</button>

<button type="reset" class="reset">Clear</button>

</div>

</form>

</div>

</body>
</html>
