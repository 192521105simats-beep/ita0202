<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Student Profile</title>

<style>
/* Universal Selector */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* Body */
body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f2f4f7;
    color:#333;
}

/* Container */
.container{
    width:90%;
    max-width:900px;
    margin:30px auto;
    background:#fff;
    border:2px solid #ddd;
    border-radius:12px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* Heading */
h1{
    text-align:center;
    color:#0066cc;
    margin-bottom:20px;
}

/* Profile Section */
.profile{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
}

/* Profile Image */
.profile img{
    width:170px;
    height:170px;
    border-radius:50%;
    border:4px solid #0066cc;
    object-fit:cover;
}

/* Information */
.info p{
    margin:8px 0;
    font-size:18px;
}

/* Skills */
.skills{
    margin-top:20px;
}

.skills h2{
    color:#0066cc;
    margin-bottom:10px;
}

.skills ul{
    margin-left:20px;
}

.skills li{
    margin-bottom:8px;
    font-size:17px;
}

/* Contact Button */
.btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#0066cc;
    color:white;
    text-decoration:none;
    border-radius:6px;
    transition:0.3s;
}

.btn:hover{
    background:#004a99;
}

/* Responsive Design */
@media(max-width:768px){

.profile{
    flex-direction:column;
    text-align:center;
}

.profile img{
    width:140px;
    height:140px;
}

.info p{
    font-size:16px;
}

h1{
    font-size:28px;
}

}

@media(max-width:480px){

.container{
    padding:15px;
}

.profile img{
    width:120px;
    height:120px;
}

.info p{
    font-size:15px;
}

.btn{
    width:100%;
    text-align:center;
}

}
</style>

</head>

<body>

<div class="container">

    <h1>Student Profile</h1>

    <div class="profile">

        <!-- Your Local Image -->
        <img src="Photos/hari.jpg" alt="Profile">

        <div class="info">
            <p><strong>Name:</strong> Hariprasad R</p>
            <p><strong>Register No:</strong> 192421179</p>
            <p><strong>Department:</strong> Information Technology</p>
            <p><strong>Year:</strong> III Year</p>
            <p><strong>Email:</strong> 192421179.simats@saveetha.com</p>
        </div>

    </div>

    <div class="skills">
        <h2>Skills</h2>
        <ul>
            <li>HTML & CSS</li>
            <li>Java Programming</li>
            <li>Python Programming</li>
            <li>Web Development</li>
            <li>Database Management</li>
        </ul>
    </div>

    <a href="mailto:192421179.simats@saveetha.com" class="btn">Contact Student</a>

</div>

</body>
</html>
